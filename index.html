<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Wezepse Voetbalpoule WK 2026</title>
<style>
:root{
  --bg:#111314;--bg2:#1c1e21;--bg3:#252729;
  --orange:#FF6000;--orange2:#FF7A2A;
  --white:#ffffff;--text1:#ffffff;--text2:#aaaaaa;--text3:#666;
  --border:#2a2c2f;--success:#27c96a;--danger:#e74c3c;
  --radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;padding-bottom:80px;}

/* HEADER */
.site-header{position:relative;margin-bottom:0;}
.header-banner{width:100%;height:220px;object-fit:cover;object-position:center 30%;display:block;cursor:pointer;user-select:none;}
.header-overlay{position:absolute;bottom:0;left:0;right:0;height:100px;background:linear-gradient(to bottom,transparent 0%,var(--bg) 100%);pointer-events:none;}

/* SAVE BAR */
.save-bar{background:var(--bg);text-align:center;padding:2px 8px;min-height:0;border-bottom:none;}
.save-txt{font-size:11px;color:var(--text2);}
#admin-indicator{background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;display:none;cursor:pointer;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0 8px;background:none;border:none;color:var(--text2);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:.2s;gap:4px;}
.nav-btn svg{width:22px;height:22px;stroke:var(--text2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.2s;}
.nav-btn.active{color:var(--orange);}
.nav-btn.active svg{stroke:var(--orange);}

/* MAIN */
.main{max-width:600px;margin:0 auto;padding:4px 12px 20px;}
.sec{display:none;}.sec.active{display:block;}

/* SECTION HEADER */
.section-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin:8px 0 10px;}

/* CARDS */
.card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text1);}
.card-body{padding:14px 16px;}

/* STAND CARD */
.stand-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
.stand-header{background:linear-gradient(135deg,#1a1200,#2a1a00);padding:14px 16px;border-bottom:1px solid #3a2800;display:flex;align-items:center;justify-content:space-between;}
.stand-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--orange);}

/* RONDE KAARTEN */
.ronde-kaart{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:.15s;}
.ronde-kaart:active{opacity:.8;}
.ronde-kaart.actief{border-color:var(--orange);}
.ronde-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;}
.ronde-naam{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text1);}
.ronde-sub{font-size:12px;color:var(--text2);margin-top:3px;}
.ronde-badge{font-size:9px;font-weight:700;padding:3px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.badge-actief{background:rgba(255,96,0,.15);color:var(--orange);border:1px solid rgba(255,96,0,.3);}
.badge-afgelopen{background:rgba(39,201,106,.1);color:var(--success);border:1px solid rgba(39,201,106,.2);}
.badge-gepland{background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border);}
.ronde-detail{padding:0 16px 14px;border-top:1px solid var(--border);margin-top:0;}

/* RANK TABLE */
.rank-table{width:100%;border-collapse:collapse;}
.rank-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:10px 8px 6px;text-align:left;border-bottom:1px solid var(--border);}
.rank-table td{padding:11px 8px;border-bottom:1px solid var(--border);font-size:14px;}
.rank-table tr:last-child td{border-bottom:none;}
.rank-medal{font-size:18px;width:32px;}
.rank-naam{font-weight:700;color:var(--text1);}
.rank-totaal{font-size:12px;color:var(--text2);text-align:right;}
.rank-pts{font-size:18px;font-weight:800;color:var(--orange);text-align:right;}
.rank-top{background:rgba(255,96,0,.04);}

/* SCORE TABLE */
.score-table{width:100%;border-collapse:collapse;}
.score-table th{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:10px 8px 6px;text-align:left;border-bottom:1px solid var(--border);}
.score-table td{padding:8px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text1);}
.score-table tr:last-child td{border-bottom:none;}
.score-input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;color:var(--white);text-align:center;width:80px;}
.score-input:focus{border-color:var(--orange);outline:none;}

/* PLAYER GRID */
.player-grid{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.player-btn{background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:.2s;}
.player-btn.in{background:rgba(255,96,0,.15);border-color:var(--orange);color:var(--orange);}

/* PRIJS */
.prijs-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.prijs-row:last-child{border-bottom:none;}
.prijs-label{font-size:14px;color:var(--text2);}
.prijs-bedrag{font-size:16px;font-weight:800;color:var(--success);}

/* DEELNEMERS */
.deeln-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);}
.deeln-row:last-child{border-bottom:none;}
.deeln-naam{font-size:14px;font-weight:600;color:var(--text1);}
.status-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;}
.betaald{background:rgba(39,201,106,.1);color:var(--success);border:1px solid rgba(39,201,106,.2);}
.open{background:rgba(231,76,60,.1);color:var(--danger);border:1px solid rgba(231,76,60,.2);}

/* HINT */
.hint{background:rgba(255,96,0,.08);border-left:3px solid var(--orange);padding:10px 12px;border-radius:0 8px 8px 0;font-size:12px;color:var(--text2);margin:10px 0;line-height:1.6;}

/* BUTTONS */
.btn{border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.btn-orange{background:var(--orange);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-sm{padding:5px 14px;font-size:12px;}
.btn-success{background:rgba(39,201,106,.15);color:var(--success);border:1px solid rgba(39,201,106,.3);}

/* WINNAAR BOX */
.winnaar-box{background:rgba(39,201,106,.08);border:1px solid rgba(39,201,106,.2);border-radius:10px;padding:12px 14px;margin-top:10px;}
.winnaar-box-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--success);margin-bottom:8px;}

.empty{color:var(--text3);font-size:13px;padding:16px 0;text-align:center;}

.select-dark{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--text1);}

@media(max-width:400px){
  .ronde-naam{font-size:13px;}
  .rank-pts{font-size:16px;}
}
</style>
</head>

// ── SUPABASE ──────────────────────────────────────────────
async function loadState() {
  setSave('⏳ Laden...');
  try {
    const r = await fetch(SUPABASE_URL+'/rest/v1/poule_state?id=eq.1&select=data',
      {headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
    if (!r.ok){setSave('⚠️ Fout '+r.status);renderAll();return;}
    const d = await r.json();
    if (d&&d[0]&&d[0].data) {
      const s=d[0].data;
      if(Array.isArray(s.spelers)) s.spelers.forEach(sp=>{const i=state.spelers.findIndex(p=>p.naam===sp.naam);if(i>=0)state.spelers[i].betaald=!!sp.betaald;});

      setSave('✅ Geladen');
    } else {setSave('🆕 Aanmaken...');await saveState();return;}
  } catch(e){console.error(e);setSave('⚠️ Geen verbinding');}
  setTimeout(()=>setSave(''),3000);
  renderAll();
}

async function saveState() {
  const payload={spelers:state.spelers,rondes:state.rondes,scoritoScores:state.scoritoScores};
  setSave('💾 Opslaan...');
  try {
    const r=await fetch(SUPABASE_URL+'/rest/v1/poule_state',{method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify({id:1,data:payload})});
    setSave(r.ok||r.status===201||r.status===204?'✅ Opgeslagen':'❌ Fout '+r.status);
  } catch(e){setSave('❌ Geen verbinding');}
  setTimeout(()=>setSave(''),3000);
  renderAll();
}
function setSave(t){document.getElementById('save-txt').textContent=t;}
function queueSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveState,800);}

}

// ── HELPERS ───────────────────────────────────────────────
function getRondePts(rIdx,naam){
  const r=state.rondes[rIdx];if(!r)return null;
  if(r.handmatig){
    const tot=r.scores[naam]!==undefined?r.scores[naam]:null;if(tot===null)return null;
    if(rIdx <= 2){
      // Gebruik beginscore als die is ingesteld, anders vorige ronde
      const beginScore = r.beginScores && r.beginScores[naam] !== undefined ? r.beginScores[naam] : null;
      if(beginScore !== null) return tot - beginScore;
      let prev=0;for(let i=0;i<rIdx;i++){const p=state.rondes[i];if(p.handmatig&&p.scores[naam]!==undefined)prev=p.scores[naam];}
      return tot-prev;
    }
    return tot;
  }
  return state.scoritoScores[naam]!==undefined?state.scoritoScores[naam]:null;
}
function bouwRanking(rIdx){
  const r=state.rondes[rIdx];if(!r||r.deelnemers.length===0)return[];
  const items=r.deelnemers.map(naam=>{
    const pts=getRondePts(rIdx,naam);
    const totaal=r.handmatig?(r.scores[naam]!==undefined?r.scores[naam]:null):pts;
    return{naam,pts,totaal};
  });
  items.sort((a,b)=>{if(a.pts===null&&b.pts===null)return 0;if(a.pts===null)return 1;if(b.pts===null)return-1;return b.pts-a.pts;});
  return items;
}
function autoWinnaars(rIdx){
  const ranking=bouwRanking(rIdx);const met=ranking.filter(x=>x.pts!==null);
  if(met.length>=2){state.rondes[rIdx].winner1=met[0].naam;state.rondes[rIdx].winner2=met[1].naam;}
}
function getActieveRonde(){
  for(let i=0;i<state.rondes.length;i++)if(state.rondes[i].deelnemers.length>0&&!state.rondes[i].gesloten)return i;
  for(let i=state.rondes.length-1;i>=0;i--)if(state.rondes[i].deelnemers.length>0)return i;
  return-1;
}

function maakRankingTabel(rIdx,toonPrijs){
  const r=state.rondes[rIdx];const ranking=bouwRanking(rIdx);
  if(ranking.length===0)return'<div class="empty">Nog geen scores.</div>';
  const pot=r.deelnemers.length*r.inleg,p1=Math.floor(pot*.75),p2=pot-p1;
  let html='<table class="rank-table"><thead><tr><th></th><th>Naam</th>';
  if(r.handmatig)html+='<th style="text-align:right">Totaal</th>';
  html+='<th style="text-align:right">Punten</th>';
  if(toonPrijs)html+='<th style="text-align:right">Prijs</th>';
  html+='</tr></thead><tbody>';
  ranking.forEach((item,i)=>{
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'.';
    const topCls=i<2&&toonPrijs?'rank-top':'';
    const totaalTd=r.handmatig?`<td class="rank-totaal">${item.totaal!==null?item.totaal:'—'}</td>`:'';
    const prijsTd=toonPrijs?`<td style="text-align:right;font-weight:800;color:var(--success);font-size:13px;">${i===0?'€'+p1:i===1?'€'+p2:''}</td>`:'';
    html+=`<tr class="${topCls}"><td class="rank-medal">${medal}</td><td class="rank-naam">${item.naam}</td>${totaalTd}<td class="rank-pts">${item.pts!==null?item.pts:'—'}</td>${prijsTd}</tr>`;
  });
  return html+'</tbody></table>';
}

const openDetails=new Set();
function toggleDetail(idx){
  if(openDetails.has(idx))openDetails.delete(idx);
  else openDetails.add(idx);
  renderAlleRondes();
}
function toggleDeelnemer(rIdx,naam){
  const r=state.rondes[rIdx];const i=r.deelnemers.indexOf(naam);
  if(i>=0)r.deelnemers.splice(i,1);else r.deelnemers.push(naam);
  openDetails.add(rIdx);
  queueSave();renderStand();renderAlleRondes();
}
function setScore(input){
  const rIdx=parseInt(input.dataset.ridx),pIdx=parseInt(input.dataset.pidx);
  const type=input.dataset.type||'eind';
  const r=state.rondes[rIdx];if(!r)return;
  const naam=r.deelnemers[pIdx];if(!naam)return;
  const v=parseInt(input.value);

  if(type==='begin'){
    if(!r.beginScores)r.beginScores={};
    if(!isNaN(v)&&input.value.trim()!=='')r.beginScores[naam]=v;else delete r.beginScores[naam];
  } else {
    if(!isNaN(v)&&input.value.trim()!=='')r.scores[naam]=v;else delete r.scores[naam];
  }

  // Herbereken ronde punten
  const eindVal=r.scores[naam]!==undefined?r.scores[naam]:null;
  const beginVal=r.beginScores&&r.beginScores[naam]!==undefined?r.beginScores[naam]:null;
  let prev=0;
  if(beginVal!==null){prev=beginVal;}
  else{for(let pi=0;pi<rIdx;pi++){const p=state.rondes[pi];if(p.handmatig&&p.scores[naam]!==undefined)prev=p.scores[naam];}}
  const el=document.getElementById('rpts-'+rIdx+'-'+pIdx);
  if(el)el.textContent=eindVal!==null?(eindVal-prev):'—';
  autoWinnaars(rIdx);renderStand();queueSave();
}

    if (r.deelnemers.length === 0) return;
    const pot = r.deelnemers.length * r.inleg;
    const p1 = Math.floor(pot * 0.75), p2 = pot - p1;
    lines.push(`${r.name},EUR ${pot},${r.winner1 || '-'},EUR ${p1},${r.winner2 || '-'},EUR ${p2}`);
  });

  lines.push('');
  lines.push(`Geëxporteerd op: ${now}`);

  // Download
  const csv = lines.join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wezepse-poule-${now.replace(/\//g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

loadState();
</script>
