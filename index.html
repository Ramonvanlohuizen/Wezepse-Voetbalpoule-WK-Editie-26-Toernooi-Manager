<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wezepse Voetbalpoule WK 2026</title>
<style>
:root{
  --navy:#1a2a6c;--orange:#e87722;--orange2:#f59b3d;--white:#fff;
  --bg:#f4f6fb;--card:#fff;--text1:#1a2a6c;--text2:#444;--text3:#888;
  --light:#e0e6f0;--danger:#c0392b;--success:#27ae60;--radius:12px;
  --shadow:0 2px 12px rgba(26,42,108,.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;}
.site-header{background:var(--navy);padding:0;display:block;overflow:hidden;}
.header-banner{width:100%;max-height:220px;object-fit:cover;object-position:center 20%;display:block;}
.header-logo-row{display:flex;align-items:center;justify-content:center;padding:8px 0 0 0;cursor:pointer;user-select:none;}
.header-logo{height:72px;width:auto;object-fit:contain;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));}
.header-title{color:var(--white);font-size:22px;font-weight:800;letter-spacing:1px;padding:4px 0 10px;text-align:center;}
.site-nav{background:var(--navy);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:100;}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:0 8px;max-width:600px;margin:0 auto;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;padding:12px 10px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;transition:.2s;white-space:nowrap;}
.nav-btn.active{color:var(--orange);border-bottom:3px solid var(--orange);}
.nav-right{display:flex;align-items:center;gap:6px;}
.save-txt{font-size:11px;color:rgba(255,255,255,.6);}
#admin-indicator{background:var(--orange);color:var(--white);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:none;}
.main{max-width:600px;margin:0 auto;padding:12px 10px 60px;}
.sec{display:none;}.sec.active{display:block;}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
.card-header{background:linear-gradient(135deg,var(--navy),#2a3d8c);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.card-title{color:var(--white);font-size:15px;font-weight:700;}
.card-body{padding:12px 14px;}

/* Ronde kaarten */
.ronde-kaart{border:1.5px solid var(--light);border-radius:10px;padding:12px;margin-bottom:10px;}
.ronde-kaart.actief{border-color:var(--orange);background:#fffbf5;}
.ronde-kaart.afgelopen{background:#f8f8f8;opacity:.8;}
.ronde-naam{font-size:15px;font-weight:700;color:var(--navy);}
.ronde-meta{font-size:12px;color:var(--text3);margin:3px 0 6px;}
.ronde-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:6px;}
.badge-actief{background:#fff3e0;color:#e65100;}
.badge-afgelopen{background:#e8f5e9;color:#2e7d32;}
.badge-gepland{background:#e3f2fd;color:#1565c0;}

/* Deelnemer toggles */
.round-grid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
.player-btn{border:2px solid var(--light);background:var(--white);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;color:var(--text2);}
.player-btn.in{border-color:var(--orange);background:var(--orange);color:var(--white);}

/* Score invoer */
.score-table{width:100%;border-collapse:collapse;font-size:13px;}
.score-table th{padding:6px 8px;background:var(--navy);color:var(--white);text-align:left;font-size:12px;}
.score-table td{padding:5px 8px;border-bottom:1px solid var(--light);}
.score-table tr:last-child td{border-bottom:none;}
.score-input{width:60px;border:1.5px solid var(--light);border-radius:6px;padding:3px 6px;font-size:13px;text-align:center;}
.score-input:focus{border-color:var(--orange);outline:none;}

/* Ranglijst */
.rank-table{width:100%;border-collapse:collapse;font-size:13px;}
.rank-table th{padding:6px 8px;background:var(--navy);color:var(--white);text-align:left;font-size:12px;}
.rank-table td{padding:7px 8px;border-bottom:1px solid var(--light);}
.rank-table tr:last-child td{border-bottom:none;}
.rank-pos{font-weight:800;color:var(--text3);width:28px;}
.rank-gold{color:#c9a400;font-weight:800;}
.rank-silver{color:#888;font-weight:800;}
.rank-bronze{color:#a05010;font-weight:800;}
.rank-pts{font-weight:700;color:var(--orange);text-align:right;}
.rank-euro{font-size:12px;color:var(--success);font-weight:700;text-align:right;}

/* Winnaar selectie */
.win-select{border:1.5px solid var(--light);border-radius:6px;padding:4px 8px;font-size:13px;color:var(--text2);background:var(--white);cursor:pointer;}

/* Prijzen */
.prijs-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--light);}
.prijs-row:last-child{border-bottom:none;}
.prijs-label{font-size:14px;color:var(--text2);}
.prijs-bedrag{font-size:15px;font-weight:700;color:var(--success);}

/* Deelnemers */
.deeln-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--light);}
.deeln-row:last-child{border-bottom:none;}
.deeln-naam{font-size:14px;font-weight:600;color:var(--text1);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;cursor:pointer;}
.badge-betaald{background:#e8f5e9;color:#2e7d32;}
.badge-open{background:#fce4ec;color:#c62828;}

/* Buttons */
.btn{display:inline-block;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
.btn-primary{background:var(--orange);color:var(--white);}
.btn-primary:hover{background:var(--orange2);}
.btn-outline{background:transparent;border:2px solid var(--navy);color:var(--navy);}
.btn-danger{background:var(--danger);color:var(--white);}
.btn-sm{padding:4px 10px;font-size:12px;}
.btn-success{background:var(--success);color:var(--white);}

/* Tabs sub */
.sub-tabs{display:flex;gap:6px;margin-bottom:12px;border-bottom:2px solid var(--light);padding-bottom:8px;}
.sub-tab{background:none;border:none;padding:6px 12px;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-radius:6px 6px 0 0;transition:.2s;}
.sub-tab.active{background:var(--orange);color:var(--white);}

/* Lege state */
.empty-state{color:var(--text3);font-size:13px;padding:12px 0;text-align:center;}

/* Scorito info */
.scorito-hint{background:#e3f2fd;border-left:4px solid var(--navy);padding:8px 12px;border-radius:0 6px 6px 0;font-size:12px;color:var(--text2);margin:8px 0;}

@media(max-width:400px){
  .header-title{font-size:18px;}
  .nav-btn{font-size:12px;padding:10px 7px;}
  .card-body{padding:10px;}
}
</style>
</head>

// ============================================================
// SUPABASE
// ============================================================
async function loadState() {
  setSaveTxt('⏳ Laden...');
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/poule_state?id=eq.1&select=data`, {
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
    });
    if (!r.ok) {
      console.error('Load HTTP error:', r.status);
      setSaveTxt('⚠️ Laad-fout ' + r.status);
      setTimeout(() => setSaveTxt(''), 4000);
      renderAll();
      return;
    }
    const d = await r.json();
    if (d && d[0] && d[0].data) {
      const saved = d[0].data;
      // Spelers: alleen betaald-status overnemen, namen nooit overschrijven
      if (Array.isArray(saved.players)) {
        saved.players.forEach(sp => {
          const idx = state.players.findIndex(p => p.name === sp.name);
          if (idx >= 0) state.players[idx].betaald = sp.betaald === true;
        });
      }
      // Rondes: alleen opgeslagen velden overnemen, vaste config (name/periode/etc) blijft
      if (Array.isArray(saved.rounds)) {
        saved.rounds.forEach((sr, i) => {
          if (state.rounds[i]) {
            state.rounds[i].participants = Array.isArray(sr.participants) ? sr.participants : [];
            state.rounds[i].winner1 = sr.winner1 || '';
            state.rounds[i].winner2 = sr.winner2 || '';
            state.rounds[i].scores = (sr.scores && typeof sr.scores === 'object') ? sr.scores : {};
          }
        });
      }
      // Scorito scores
      if (saved.scoritoScores && typeof saved.scoritoScores === 'object') {
        state.scoritoScores = saved.scoritoScores;
      }
      setSaveTxt('✅ Geladen');
    } else {
      // Geen data in DB — eerste keer, direct opslaan om record aan te maken
      setSaveTxt('🆕 Nieuw record aanmaken...');
      await saveState();
      return;
    }
  } catch(e) {
    console.error('Load exception:', e);
    setSaveTxt('⚠️ Geen verbinding');
  }
  setTimeout(() => setSaveTxt(''), 3000);
  renderAll();
}

async function saveState() {
  const payload = {
    players: state.players,
    rounds: state.rounds,
    scoritoScores: state.scoritoScores
  };
  setSaveTxt('💾 Opslaan...');
  try {
    // Gebruik upsert: POST met on-conflict update
    const r = await fetch(`${SUPABASE_URL}/rest/v1/poule_state`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({id: 1, data: payload})
    });
    if (r.ok || r.status === 200 || r.status === 201 || r.status === 204) {
      setSaveTxt('✅ Opgeslagen');
    } else {
      const errText = await r.text().catch(() => '');
      console.error('Save error:', r.status, errText);
      // Fallback: probeer PATCH
      const patch = await fetch(`${SUPABASE_URL}/rest/v1/poule_state?id=eq.1`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({data: payload})
      });
      if (patch.ok || patch.status === 204) {
        setSaveTxt('✅ Opgeslagen');
      } else {
        console.error('Patch fallback error:', patch.status);
        setSaveTxt('❌ Opslaan mislukt! Probeer opnieuw.');
        // Toon fout langer zodat gebruiker het ziet
        setTimeout(() => setSaveTxt(''), 8000);
        return;
      }
    }
  } catch(e) {
    console.error('Save exception:', e);
    setSaveTxt('❌ Geen verbinding — niet opgeslagen!');
    setTimeout(() => setSaveTxt(''), 8000);
    return;
  }
  setTimeout(() => setSaveTxt(''), 3000);
}

function setSaveTxt(t) { document.getElementById('save-txt').textContent = t; }
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 600);
}

function getHuidigeRonde() {
  // Huidige ronde = eerste ronde met deelnemers maar nog geen 2 winnaars
  for (let i = 0; i < state.rounds.length; i++) {
    const r = state.rounds[i];
    if (r.participants.length > 0 && (!r.winner1 || !r.winner2)) return i;
  }
  // Als alle rondes afgerond: laatste met deelnemers
  for (let i = state.rounds.length - 1; i >= 0; i--) {
    if (state.rounds[i].participants.length > 0) return i;
  }
  return -1;
}

function renderHuidigeRonde() {
  const idx = getHuidigeRonde();
  const card = document.getElementById('card-huidige-ronde');
  const content = document.getElementById('huidige-ronde-content');
  const titel = document.getElementById('huidige-ronde-titel');

  if (idx < 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  const r = state.rounds[idx];
  titel.textContent = '📊 ' + r.name + ' — Ranglijst';

  // Build ranking for this round
  const ranking = buildRoundRanking(idx);
  if (ranking.length === 0) {
    content.innerHTML = '<div class="empty-state">Nog geen scores ingevoerd voor deze ronde.</div>';
    return;
  }

  const pot = r.participants.length * r.inleg;
  const prize1 = Math.floor(pot * 0.75);
  const prize2 = pot - prize1;

  let html = `<p style="font-size:12px;color:var(--text3);margin-bottom:8px;">
    ${r.participants.length} deeln. · pot: €${pot} · 1e: €${prize1} · 2e: €${prize2}
  </p>`;
  html += '<table class="rank-table"><thead><tr><th>#</th><th>Naam</th><th style="text-align:right">Pts</th></tr></thead><tbody>';
  ranking.forEach((item, i) => {
    const cls = i===0 ? 'rank-gold' : i===1 ? 'rank-silver' : i===2 ? 'rank-bronze' : 'rank-pos';
    const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : (i+1)+'.';
    html += `<tr>
      <td class="${cls}">${medal}</td>
      <td style="font-weight:600">${item.name}</td>
      <td class="rank-pts">${item.pts !== null ? item.pts : '—'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  content.innerHTML = html;
}

function buildRoundRanking(idx) {
  const r = state.rounds[idx];
  if (!r || r.participants.length === 0) return [];

  let items = r.participants.map(name => {
    let pts = null;
    if (r.handmatig) {
      // scores = Scorito lopend totaal na deze ronde
      // Ronde-punten = totaal deze ronde - som van alle vorige handmatige rondes
      const totaalDezeRonde = r.scores && r.scores[name] !== undefined ? r.scores[name] : null;
      if (totaalDezeRonde !== null) {
        // Bereken totaal van alle vorige handmatige rondes voor deze speler
        let vorigTotaal = 0;
        for (let i = 0; i < idx; i++) {
          const prev = state.rounds[i];
          if (prev.handmatig && prev.scores && prev.scores[name] !== undefined) {
            // Gebruik het totaal van de LAATSTE vorige ronde (cumulatief)
            vorigTotaal = prev.scores[name];
          }
        }
        pts = totaalDezeRonde - vorigTotaal;
      }
    } else {
      pts = state.scoritoScores[name] !== undefined ? state.scoritoScores[name] : null;
    }
    return {name, pts};
  });

  // Sort: players with scores first, then by points desc
  items.sort((a, b) => {
    if (a.pts === null && b.pts === null) return 0;
    if (a.pts === null) return 1;
    if (b.pts === null) return -1;
    return b.pts - a.pts;
  });
  return items;
}

function renderRondesOverzicht() {
  const el = document.getElementById('rondes-overzicht');
  if (!el) return;

  let html = '';
  state.rounds.forEach((r, i) => {
    const isAfgelopen = r.winner1 && r.winner2;
    const isActief = !isAfgelopen && r.participants.length > 0;
    const isPot = r.participants.length * r.inleg;

    let cls = 'ronde-kaart';
    let badge = '';
    if (isAfgelopen) {
      cls += ' afgelopen';
      badge = '<span class="ronde-badge badge-afgelopen">✅ Afgelopen</span>';
    } else if (isActief) {
      cls += ' actief';
      badge = '<span class="ronde-badge badge-actief">🔥 Actief</span>';
    } else {
      badge = '<span class="ronde-badge badge-gepland">📅 Gepland</span>';
    }

    html += `<div class="${cls}">`;
    html += `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;">
      <span class="ronde-naam">${r.name}</span>${badge}
    </div>`;

    if (r.periode) {
      html += `<div class="ronde-meta">📅 ${r.periode}</div>`;
    }
    if (r.eerste_wedstrijd) {
      html += `<div class="ronde-meta">⚽ ${r.eerste_wedstrijd} → ${r.laatste_wedstrijd}</div>`;
    }
    if (r.handmatig) {
      html += `<div class="ronde-meta" style="color:#e65100;">📝 Scores handmatig ingevoerd na afloop ronde</div>`;
    }

    if (r.participants.length > 0) {
      html += `<div class="ronde-meta" style="margin-top:6px;">${r.participants.length} deelnemers · pot: <strong>€${isPot}</strong>`;
      if (r.inleg === 20) html += ` <span style="color:var(--orange);font-weight:700;">(Superronde €20)</span>`;
      html += `</div>`;
    }

    if (isAfgelopen) {
      const pot = r.participants.length * r.inleg;
      html += `<div style="margin-top:6px;font-size:13px;">
        🥇 <strong>${r.winner1}</strong> — €${Math.floor(pot*0.75)}<br>
        🥈 <strong>${r.winner2}</strong> — €${pot - Math.floor(pot*0.75)}
      </div>`;
    }

    html += '</div>';
  });

  el.innerHTML = html || '<div class="empty-state">Geen rondes geconfigureerd.</div>';
}

// ============================================================
// BEHEER (admin)
// ============================================================
function renderBeheer() {
  const card = document.getElementById('rondes-beheer-card');
  const content = document.getElementById('rondes-beheer-content');
  if (!card) return;

  card.style.display = isAdmin ? 'block' : 'none';
  if (!isAdmin) return;

  const sel = document.getElementById('round-select');
  sel.innerHTML = state.rounds.map((r,i) => `<option value="${i}">${r.name}</option>`).join('');
  sel.value = currentRound;

  const r = state.rounds[currentRound] || state.rounds[0];
  if (!r) { content.innerHTML = ''; return; }

  const pot = r.participants.length * r.inleg;
  const pOpts = ['<option value="">— kies —</option>',
    ...r.participants.map(p => `<option value="${p}">${p}</option>`)
  ].join('');

  let html = `<p style="font-size:12px;color:var(--text2);margin-bottom:8px;">
    Klik op een naam om deelnemer toe/te verwijderen (inleg €${r.inleg}${r.inleg===20?' – Superronde!':''}).
  </p>`;

  // Player toggle grid
  html += '<div class="round-grid">';
  state.players.forEach(p => {
    const inRound = r.participants.includes(p.name);
    html += `<button class="player-btn ${inRound?'in':''}" onclick="toggleParticipant(${currentRound},'${p.name.replace(/'/g,"\'")}')">
      ${p.name}
    </button>`;
  });
  html += `</div>`;

  html += `<div style="margin:10px 0;font-size:13px;color:var(--text2);">
    ${r.participants.length} deelnemers · pot: <strong>€${pot}</strong>
  </div>`;

  // Score invoer voor poulefase
  if (r.handmatig) {
    html += `<div style="margin:12px 0;">
      <div style="font-weight:700;font-size:14px;color:var(--navy);margin-bottom:8px;">
        📝 Scores invullen (na afloop ronde)
      </div>
      <div class="scorito-hint">
        Vul het <strong>Scorito totaalstand</strong> per deelnemer in na de laatste wedstrijd van deze ronde.
        De ronde-punten worden automatisch berekend door de vorige rondes eraf te trekken.
      </div>`;
    if (r.participants.length === 0) {
      html += '<div class="empty-state">Voeg eerst deelnemers toe.</div>';
    } else {
      html += '<table class="score-table"><thead><tr><th>Deelnemer</th><th>Scorito totaal</th><th>Ronde pts</th></tr></thead><tbody>';
      r.participants.forEach((pname, pIdx) => {
        const val = r.scores && r.scores[pname] !== undefined ? r.scores[pname] : '';
        let vorigTotaal = 0;
        for (let pi = 0; pi < currentRound; pi++) {
          const prev = state.rounds[pi];
          if (prev.handmatig && prev.scores && prev.scores[pname] !== undefined) {
            vorigTotaal = prev.scores[pname];
          }
        }
        const rondePts = val !== '' ? (parseInt(val) - vorigTotaal) : '&mdash;';
        html += '<tr>' +
          '<td>' + pname + '</td>' +
          '<td><input type="number" class="score-input" value="' + val + '" ' +
          'placeholder="bijv. 142" ' +
          'data-ridx="' + currentRound + '" data-pidx="' + pIdx + '" ' +
          'oninput="setScoreByIdx(this)"></td>' +
          '<td style="font-weight:700;color:var(--orange);text-align:center;" id="rpts-' + currentRound + '-' + pIdx + '">' + rondePts + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
    }
    
html += '</div>';
  }

  // Winnaar selectie
  html += `<div style="margin-top:12px;">
    <div style="font-weight:700;font-size:14px;color:var(--navy);margin-bottom:8px;">🏆 Winnaars aanwijzen</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:13px;width:60px;">🥇 1e:</span>
        <select class="win-select" onchange="setWinner(${currentRound},1,this.value)">${pOpts}</select>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:13px;width:60px;">🥈 2e:</span>
        <select class="win-select" onchange="setWinner(${currentRound},2,this.value)">${pOpts}</select>
      </div>
    </div>
  </div>`;

  // Fix select values
  content.innerHTML = html;
  
  // Set winner selects
  setTimeout(() => {
    const sels = content.querySelectorAll('select');
    if (sels[0]) sels[0].value = r.winner1 || '';
    if (sels[1]) sels[1].value = r.winner2 || '';
  }, 0);
}

function toggleParticipant(rIdx, pname) {
  const r = state.rounds[rIdx];
  const i = r.participants.indexOf(pname);
  if (i >= 0) r.participants.splice(i, 1);
  else r.participants.push(pname);
  queueSave(); renderAll();
}

function setScore(rIdx, pname, val) {
  const r = state.rounds[rIdx];
  if (!r.scores) r.scores = {};
  const v = parseInt(val);
  if (!isNaN(v)) r.scores[pname] = v;
  else delete r.scores[pname];
  queueSave(); renderAll();
}

function setScoreByIdx(input) {
  const rIdx = parseInt(input.dataset.ridx);
  const pIdx = parseInt(input.dataset.pidx);
  const r = state.rounds[rIdx];
  if (!r) return;
  const pname = r.participants[pIdx];
  if (!pname) return;
  if (!r.scores) r.scores = {};
  const v = parseInt(input.value);
  if (!isNaN(v) && input.value.trim() !== '') {
    r.scores[pname] = v;
  } else {
    delete r.scores[pname];
  }
  // Update ronde pts inline zonder focus te verliezen
  let vorigTotaal = 0;
  for (let pi = 0; pi < rIdx; pi++) {
    const prev = state.rounds[pi];
    if (prev.handmatig && prev.scores && prev.scores[pname] !== undefined) {
      vorigTotaal = prev.scores[pname];
    }
  }
  const rondePts = (!isNaN(v) && input.value.trim() !== '') ? (v - vorigTotaal) : '—';
  const rptsEl = document.getElementById('rpts-' + rIdx + '-' + pIdx);
  if (rptsEl) rptsEl.textContent = rondePts;
  queueSave();
}

function setScoreByIdx(input) {
  const rIdx = parseInt(input.dataset.ridx);
  const pIdx = parseInt(input.dataset.pidx);
  const r = state.rounds[rIdx];
  if (!r) return;
  const pname = r.participants[pIdx];
  if (!pname) return;
  if (!r.scores) r.scores = {};
  const v = parseInt(input.value);
  if (!isNaN(v) && input.value !== '') {
    r.scores[pname] = v;
  } else {
    delete r.scores[pname];
  }
  // Update ronde pts display inline (geen full re-render om focus niet te verliezen)
  let vorigTotaal = 0;
  for (let pi = 0; pi < rIdx; pi++) {
    const prev = state.rounds[pi];
    if (prev.handmatig && prev.scores && prev.scores[pname] !== undefined) {
      vorigTotaal = prev.scores[pname];
    }
  }
  const rondePts = (!isNaN(v) && input.value !== '') ? (v - vorigTotaal) : '—';
  const rptsEl = document.getElementById('rpts-' + rIdx + '-' + pIdx);
  if (rptsEl) rptsEl.textContent = rondePts;
  queueSave();
}

function setWinner(rIdx, pos, val) {
  if (pos === 1) state.rounds[rIdx].winner1 = val;
  else state.rounds[rIdx].winner2 = val;
  queueSave(); renderAll();
}

// ============================================================
// PRIJZEN
// ============================================================
function renderPrijzen() {
  const el1 = document.getElementById('eindprijzen-content');
  const el2 = document.getElementById('rondeprijzen-content');
  if (!el1 || !el2) return;

  const totalEind = state.players.filter(p=>p.betaald).length * 25;
  const p1 = Math.floor(totalEind * 0.60);
  const p2 = Math.floor(totalEind * 0.30);
  const p3 = totalEind - p1 - p2;

  el1.innerHTML = `
    <div class="prijs-row"><span class="prijs-label">Totale eindpot (€25 p.p.)</span><span class="prijs-bedrag">€${totalEind}</span></div>
    <div class="prijs-row"><span class="prijs-label">🥇 1e plaats (60%)</span><span class="prijs-bedrag">€${p1}</span></div>
    <div class="prijs-row"><span class="prijs-label">🥈 2e plaats (30%)</span><span class="prijs-bedrag">€${p2}</span></div>
    <div class="prijs-row"><span class="prijs-label">🥉 3e plaats (10%)</span><span class="prijs-bedrag">€${p3}</span></div>
  `;

  let html2 = '';
  state.rounds.forEach((r, i) => {
    if (r.participants.length === 0) return;
    const pot = r.participants.length * r.inleg;
    const rp1 = Math.floor(pot * 0.75);
    const rp2 = pot - rp1;
    html2 += `<div style="margin-bottom:14px;">
      <div style="font-weight:700;font-size:14px;color:var(--navy);margin-bottom:6px;">${r.name}</div>
      <div class="prijs-row"><span class="prijs-label">Rondeput (${r.participants.length}×€${r.inleg})</span><span class="prijs-bedrag">€${pot}</span></div>
      <div class="prijs-row"><span class="prijs-label">🥇 1e (75%)</span>
        <span class="prijs-bedrag">${r.winner1 ? '🏆 '+r.winner1+' · ' : ''}€${rp1}</span></div>
      <div class="prijs-row"><span class="prijs-label">🥈 2e (25%)</span>
        <span class="prijs-bedrag">${r.winner2 ? '🥈 '+r.winner2+' · ' : ''}€${rp2}</span></div>
    </div>`;
  });

  el2.innerHTML = html2 || '<div class="empty-state">Nog geen rondes met deelnemers.</div>';
}

// ============================================================
// DEELNEMERS
// ============================================================
function renderDeelnemers() {
  const el = document.getElementById('deelnemers-list');
  const totaal = document.getElementById('deeln-totaal');
  if (!el) return;

  const betaald = state.players.filter(p=>p.betaald).length;
  if (totaal) totaal.textContent = `${betaald}/${state.players.length} betaald · €${betaald*25}`;

  el.innerHTML = state.players.map((p,i) => `
    <div class="deeln-row">
      <span class="deeln-naam">${p.name}</span>
      <span class="badge ${p.betaald?'badge-betaald':'badge-open'}"
        ${isAdmin?`onclick="toggleBetaald(${i})" style="cursor:pointer"`:''}
      >${p.betaald?'✅ Betaald':'⏳ Open'}</span>
    </div>
  `).join('');
}

function toggleBetaald(i) {
  state.players[i].betaald = !state.players[i].betaald;
  queueSave(); renderDeelnemers();
}

// ============================================================
// INIT
// ============================================================
loadState();
</script>
