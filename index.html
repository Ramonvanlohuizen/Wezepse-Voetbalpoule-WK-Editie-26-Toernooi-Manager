<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
<title>Wezepse Voetbalpoule WK 2026</title>
<style>
:root{
  --navy:#1a2a6c;--navy2:#243080;--orange:#e87722;--orange2:#f59b3d;--white:#fff;
  --bg:#eef1f8;--card:#fff;--text1:#1a2a6c;--text2:#444;--text3:#888;
  --light:#dde3f0;--danger:#c0392b;--success:#1e9e5a;--radius:14px;
  --shadow:0 4px 20px rgba(26,42,108,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text1);min-height:100vh;}

/* HEADER */
.site-header{background:var(--navy);padding:0;display:block;overflow:hidden;}
.header-banner{width:100%;height:200px;object-fit:cover;object-position:center center;display:block;}

/* NAV */
.site-nav{background:var(--navy);border-bottom:3px solid var(--orange);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.nav-inner{display:flex;align-items:center;justify-content:center;padding:0;max-width:600px;margin:0 auto;gap:0;}
.nav-btn{background:none;border:none;color:rgba(255,255,255,.6);font-size:12px;font-weight:700;padding:13px 20px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;transition:.2s;white-space:nowrap;text-transform:uppercase;letter-spacing:1.5px;}
.nav-btn.active{color:var(--orange);border-bottom:3px solid var(--orange);}
.nav-btn:hover{color:var(--white);}
.save-txt{font-size:11px;color:rgba(255,255,255,.6);}

/* MAIN */
.main{max-width:600px;margin:0 auto;padding:14px 10px 70px;}
.sec{display:none;}.sec.active{display:block;}

/* CARDS */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;border:1px solid rgba(26,42,108,.07);}
.card-header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;}
.card-title{color:var(--white);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;}
.card-body{padding:14px;}

/* RONDE KAARTEN */
.ronde-kaart{border:1.5px solid var(--light);border-radius:10px;padding:13px;margin-bottom:10px;transition:.2s;background:var(--white);}
.ronde-kaart:last-child{margin-bottom:0;}
.ronde-kaart.actief{border-color:var(--orange);background:linear-gradient(135deg,#fffbf5,#fff8ee);box-shadow:0 2px 12px rgba(232,119,34,.15);}
.ronde-kaart.afgelopen{background:#f7f9fc;opacity:.85;}
.ronde-naam{font-size:14px;font-weight:700;color:var(--navy);}
.ronde-meta{font-size:12px;color:var(--text3);margin:3px 0 4px;line-height:1.5;}
.ronde-badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:6px;letter-spacing:.5px;text-transform:uppercase;}
.badge-actief{background:#fff3e0;color:#e65100;}
.badge-afgelopen{background:#e6f7ef;color:#1e7e4a;}
.badge-gepland{background:#e8eeff;color:#2a4db0;}

/* RANG TABEL */
.rank-table{width:100%;border-collapse:collapse;font-size:13px;}
.rank-table th{padding:8px 10px;background:var(--navy);color:rgba(255,255,255,.8);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;}
.rank-table td{padding:9px 10px;border-bottom:1px solid var(--light);}
.rank-table tr:last-child td{border-bottom:none;}
.rank-table tr:hover td{background:#f5f7fc;}
.rank-pos{font-weight:800;color:var(--text3);width:28px;}
.rank-gold{color:#c9a400;font-weight:800;font-size:15px;}
.rank-silver{color:#888;font-weight:800;font-size:15px;}
.rank-bronze{color:#a05010;font-weight:800;font-size:15px;}
.rank-pts{font-weight:800;color:var(--orange);text-align:right;font-size:14px;}

/* SCORE TABEL */
.score-table{width:100%;border-collapse:collapse;font-size:13px;}
.score-table th{padding:7px 10px;background:var(--navy);color:rgba(255,255,255,.8);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;}
.score-table td{padding:6px 10px;border-bottom:1px solid var(--light);}
.score-table tr:last-child td{border-bottom:none;}
.score-input{width:70px;border:1.5px solid var(--light);border-radius:8px;padding:5px 8px;font-size:13px;text-align:center;transition:.2s;}
.score-input:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px rgba(232,119,34,.15);}

/* DEELNEMERS */
.deeln-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--light);}
.deeln-row:last-child{border-bottom:none;}
.deeln-naam{font-size:14px;font-weight:600;color:var(--text1);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;cursor:pointer;letter-spacing:.3px;}
.badge-betaald{background:#e6f7ef;color:#1e7e4a;}
.badge-open{background:#fde8e8;color:#c0392b;}

/* PRIJZEN */
.prijs-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--light);}
.prijs-row:last-child{border-bottom:none;}
.prijs-label{font-size:14px;color:var(--text2);}
.prijs-bedrag{font-size:15px;font-weight:800;color:var(--success);}

/* PLAYER BUTTONS */
.round-grid{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;}
.player-btn{border:2px solid var(--light);background:var(--white);border-radius:20px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;color:var(--text2);}
.player-btn.in{border-color:var(--orange);background:var(--orange);color:var(--white);}
.player-btn:hover{border-color:var(--navy);color:var(--navy);}
.player-btn.in:hover{background:var(--orange2);}

/* WINNAAR SELECT */
.win-select{border:1.5px solid var(--light);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--text2);background:var(--white);cursor:pointer;transition:.2s;}
.win-select:focus{border-color:var(--orange);outline:none;}

/* HINTS */
.scorito-hint{background:#eef2ff;border-left:4px solid var(--navy2);padding:9px 12px;border-radius:0 8px 8px 0;font-size:12px;color:var(--text2);margin:10px 0;line-height:1.5;}

/* LEGE STATE */
.empty-state{color:var(--text3);font-size:13px;padding:16px 0;text-align:center;}

/* BUTTONS */
.btn{display:inline-block;border:none;border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:.3px;}
.btn-primary{background:var(--orange);color:var(--white);}
.btn-primary:hover{background:var(--orange2);}

/* ADMIN BALK */
#admin-bar{background:linear-gradient(135deg,var(--navy),var(--navy2));text-align:center;padding:4px 8px;min-height:22px;border-bottom:1px solid rgba(255,255,255,.1);}

@media(max-width:400px){
  .nav-btn{font-size:11px;padding:12px 13px;letter-spacing:.8px;}
  .card-body{padding:11px;}
  .main{padding:10px 8px 70px;}
}
</style>
</head>

// ============================================================
// SUPABASE

async function loadState() {
  setSaveTxt('⏳ Laden...');
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/poule_state?id=eq.1&select=data`, {
      headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY}
    });
    if (!r.ok) {
      console.error('Load HTTP error:', r.status);
      setSaveTxt('⚠️ Laad-fout ' + r.status);
      setTimeout(() => setSaveTxt(''), 4000);
      renderAll();
      return;
    }
    const d = await r.json();
    if (d && d[0] && d[0].data) {
      const saved = d[0].data;
      // Spelers: alleen betaald-status overnemen, namen nooit overschrijven
      if (Array.isArray(saved.players)) {
        saved.players.forEach(sp => {
          const idx = state.players.findIndex(p => p.name === sp.name);
          if (idx >= 0) state.players[idx].betaald = sp.betaald === true;
        });
      }
      // Rondes: alleen opgeslagen velden overnemen, vaste config (name/periode/etc) blijft
      if (Array.isArray(saved.rounds)) {
        saved.rounds.forEach((sr, i) => {
          if (state.rounds[i]) {
            state.rounds[i].participants = Array.isArray(sr.participants) ? sr.participants : [];
            state.rounds[i].winner1 = sr.winner1 || '';
            state.rounds[i].winner2 = sr.winner2 || '';
            state.rounds[i].scores = (sr.scores && typeof sr.scores === 'object') ? sr.scores : {};
            state.rounds[i].gesloten = sr.gesloten === true;
          }
        });
      }
      // Scorito scores
      if (saved.scoritoScores && typeof saved.scoritoScores === 'object') {
        state.scoritoScores = saved.scoritoScores;
      }
      setSaveTxt('✅ Geladen');
    } else {
      // Geen data in DB — eerste keer, direct opslaan om record aan te maken
      setSaveTxt('🆕 Nieuw record aanmaken...');
      await saveState();
      return;
    }
  } catch(e) {
    console.error('Load exception:', e);
    setSaveTxt('⚠️ Geen verbinding');
  }
  setTimeout(() => setSaveTxt(''), 3000);
  renderAll();
}

async function saveState() {
  const payload = {
    players: state.players,
    rounds: state.rounds,
    scoritoScores: state.scoritoScores
  };
  setSaveTxt('💾 Opslaan...');
  try {
    // Gebruik upsert: POST met on-conflict update
    const r = await fetch(`${SUPABASE_URL}/rest/v1/poule_state`, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({id: 1, data: payload})
    });
    if (r.ok || r.status === 200 || r.status === 201 || r.status === 204) {
      setSaveTxt('✅ Opgeslagen');
    } else {
      const errText = await r.text().catch(() => '');
      console.error('Save error:', r.status, errText);
      // Fallback: probeer PATCH
      const patch = await fetch(`${SUPABASE_URL}/rest/v1/poule_state?id=eq.1`, {
        method: 'PATCH',
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': 'Bearer ' + SUPABASE_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({data: payload})
      });
      if (patch.ok || patch.status === 204) {
        setSaveTxt('✅ Opgeslagen');
      } else {
        console.error('Patch fallback error:', patch.status);
        setSaveTxt('❌ Opslaan mislukt! Probeer opnieuw.');
        // Toon fout langer zodat gebruiker het ziet
        setTimeout(() => setSaveTxt(''), 8000);
        return;
      }
    }
  } catch(e) {
    console.error('Save exception:', e);
    setSaveTxt('❌ Geen verbinding — niet opgeslagen!');
    setTimeout(() => setSaveTxt(''), 8000);
    return;
  }
  setTimeout(() => setSaveTxt(''), 3000);
}

function setSaveTxt(t) { document.getElementById('save-txt').textContent = t; }
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 600);
}

function getHuidigeRonde() {
  // Huidige ronde = eerste ronde met deelnemers die niet gesloten is
  for (let i = 0; i < state.rounds.length; i++) {
    const r = state.rounds[i];
    if (r.participants.length > 0 && !r.gesloten) return i;
  }
  // Als alle rondes gesloten: laatste met deelnemers
  for (let i = state.rounds.length - 1; i >= 0; i--) {
    if (state.rounds[i].participants.length > 0) return i;
  }
  return -1;
}

function renderHuidigeRonde() {
  const idx = getHuidigeRonde();
  const card = document.getElementById('card-huidige-ronde');
  const content = document.getElementById('huidige-ronde-content');
  const titel = document.getElementById('huidige-ronde-titel');

  if (idx < 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = 'block';
  const r = state.rounds[idx];
  const gesloten = r.gesloten === true;
  titel.textContent = (gesloten ? '✅ ' : '📊 ') + r.name + ' — Stand';

  const ranking = buildRoundRanking(idx);
  const pot = r.participants.length * r.inleg;
  const prize1 = Math.floor(pot * 0.75);
  const prize2 = pot - prize1;

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
    <span style="font-size:12px;color:var(--text3);">${r.participants.length} deeln. · pot: <strong>€${pot}</strong> · 🥇€${prize1} · 🥈€${prize2}</span>`;

  if (isAdmin) {
    if (!gesloten) {
      html += `<button class="btn btn-primary btn-sm" onclick="sluitRonde(${idx})">✅ Ronde afsluiten</button>`;
    } else {
      html += `<button class="btn btn-outline btn-sm" onclick="herOpenRonde(${idx})">↩️ Heropenen</button>`;
    }
  }
  html += '</div>';

  if (ranking.length === 0) {
    html += '<div class="empty-state">Nog geen scores ingevoerd.</div>';
    content.innerHTML = html;
    return;
  }

  // Auto winnaars
  if (!gesloten) autoSetWinners(idx);

  const isHandmatig = r.handmatig;
  html += '<table class="rank-table"><thead><tr><th>#</th><th>Naam</th>';
  if (isHandmatig) html += '<th style="text-align:right;font-size:10px;opacity:.7;">Totaal</th>';
  html += '<th style="text-align:right">Punten</th></tr></thead><tbody>';

  ranking.forEach((item, i) => {
    const medal = i===0 ? '🥇' : i===1 ? '🥈' : i===2 ? '🥉' : (i+1)+'.';
    const cls = i===0 ? 'rank-gold' : i===1 ? 'rank-silver' : i===2 ? 'rank-bronze' : 'rank-pos';
    const totaalCol = isHandmatig ? `<td style="text-align:right;color:var(--text3);font-size:12px;">${item.totaal !== null ? item.totaal : '—'}</td>` : '';
    const winnaarStyle = (i===0||i===1) && gesloten ? 'background:#f0faf5;' : '';
    html += `<tr style="${winnaarStyle}">
      <td class="${cls}">${medal}</td>
      <td style="font-weight:600">${item.name}</td>
      ${totaalCol}
      <td class="rank-pts">${item.pts !== null ? item.pts : '—'}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  content.innerHTML = html;
}

function sluitRonde(idx) {
  if (!confirm('Ronde afsluiten? De top 2 wordt als winnaar geregistreerd.')) return;
  autoSetWinners(idx);
  state.rounds[idx].gesloten = true;
  queueSave();
  renderAll();
}

function herOpenRonde(idx) {
  state.rounds[idx].gesloten = false;
  state.rounds[idx].winner1 = '';
  state.rounds[idx].winner2 = '';
  queueSave();
  renderAll();
}

function renderRondesOverzicht() {
  const el = document.getElementById('rondes-overzicht');
  if (!el) return;

  let html = '';
  state.rounds.forEach((r, i) => {
    const isAfgelopen = r.gesloten === true;
    const isActief = !isAfgelopen && r.participants.length > 0 && !r.gesloten;
    const pot = r.participants.length * r.inleg;

    let cls = 'ronde-kaart';
    let badge = '';
    if (isAfgelopen) {
      cls += ' afgelopen';
      badge = '<span class="ronde-badge badge-afgelopen">✅ Afgelopen</span>';
    } else if (isActief) {
      cls += ' actief';
      badge = '<span class="ronde-badge badge-actief">🔥 Actief</span>';
    } else {
      badge = '<span class="ronde-badge badge-gepland">📅 Gepland</span>';
    }

    html += `<div class="${cls}" onclick="toggleRondeDetail(${i})" style="cursor:pointer;">`;
    html += `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;">
      <span class="ronde-naam">${r.name}</span>
      <div style="display:flex;align-items:center;gap:6px;">${badge}<span style="font-size:16px;color:var(--text3);" id="arrow-${i}">▼</span></div>
    </div>`;

    if (r.periode) html += `<div class="ronde-meta">📅 ${r.periode}</div>`;
    if (r.eerste_wedstrijd) html += `<div class="ronde-meta">⚽ ${r.eerste_wedstrijd} → ${r.laatste_wedstrijd}</div>`;

    if (r.participants.length > 0) {
      html += `<div class="ronde-meta" style="margin-top:4px;">${r.participants.length} deelnemers · pot: <strong>€${pot}</strong>`;
      if (r.inleg === 20) html += ` <span style="color:var(--orange);font-weight:700;">(Superronde €20)</span>`;
      html += `</div>`;
    }

    // Uitklapbaar detail
    html += `<div id="ronde-detail-${i}" style="display:none;margin-top:10px;">`;

    if (r.participants.length === 0) {
      html += '<div class="empty-state" style="padding:8px 0;">Nog geen deelnemers.</div>';
    } else {
      // Ranglijst van deze ronde
      const ranking = buildRoundRanking(i);
      const prize1 = Math.floor(pot * 0.75);
      const prize2 = pot - prize1;

      html += `<table class="rank-table"><thead><tr>
        <th>#</th><th>Naam</th>`;
      if (r.handmatig) html += `<th style="text-align:right">Totaal</th>`;
      html += `<th style="text-align:right">Ronde pts</th>`;
      if (isAfgelopen) html += `<th style="text-align:right">Prijs</th>`;
      html += `</tr></thead><tbody>`;

      ranking.forEach((item, pos) => {
        const medal = pos===0 ? '🥇' : pos===1 ? '🥈' : pos===2 ? '🥉' : (pos+1)+'.';
        const cls2 = pos===0 ? 'rank-gold' : pos===1 ? 'rank-silver' : pos===2 ? 'rank-bronze' : 'rank-pos';
        const prijs = isAfgelopen && pos===0 ? `<td style="text-align:right;color:var(--success);font-weight:700;">€${prize1}</td>`
                    : isAfgelopen && pos===1 ? `<td style="text-align:right;color:var(--success);font-weight:700;">€${prize2}</td>`
                    : isAfgelopen ? '<td></td>' : '';
        const totaalCol = r.handmatig ? `<td style="text-align:right;color:var(--text3);font-size:12px;">${item.totaal !== null ? item.totaal : '—'}</td>` : '';
        html += `<tr>
          <td class="${cls2}">${medal}</td>
          <td style="font-weight:600">${item.name}</td>
          ${totaalCol}
          <td class="rank-pts">${item.pts !== null ? item.pts : '—'}</td>
          ${prijs}
        </tr>`;
      });
      html += '</tbody></table>';
    }

    html += '</div></div>';
  });

  el.innerHTML = html || '<div class="empty-state">Geen rondes geconfigureerd.</div>';
}

function toggleRondeDetail(idx) {
  const el = document.getElementById('ronde-detail-' + idx);
  const arrow = document.getElementById('arrow-' + idx);
  if (!el) return;
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  if (arrow) arrow.textContent = open ? '▼' : '▲';
}

// ============================================================
// BEHEER (admin)
// ============================================================
function renderBeheer() {
  const card = document.getElementById('rondes-beheer-card');
  const beheerEl = document.getElementById('rondes-beheer-content');
  if (!card) return;

  card.style.display = isAdmin ? 'block' : 'none';
  if (!isAdmin) return;

  const sel = document.getElementById('round-select');
  sel.innerHTML = state.rounds.map((r,i) => `<option value="${i}">${r.name}</option>`).join('');
  sel.value = currentRound;

  const r = state.rounds[currentRound] || state.rounds[0];
  if (!r) { beheerEl.innerHTML = ''; return; }

  const pot = r.participants.length * r.inleg;
  const pOpts = ['<option value="">— kies —</option>',
    ...r.participants.map(p => `<option value="${p}">${p}</option>`)
  ].join('');

  let html = `<p style="font-size:12px;color:var(--text2);margin-bottom:8px;">
    Klik op een naam om deelnemer toe/te verwijderen (inleg €${r.inleg}${r.inleg===20?' – Superronde!':''}).
  </p>`;

  // Player toggle grid
  html += '<div class="round-grid">';
  state.players.forEach(p => {
    const inRound = r.participants.includes(p.name);
    html += `<button class="player-btn ${inRound?'in':''}" onclick="toggleParticipant(${currentRound},'${p.name.replace(/'/g,"\'")}')">
      ${p.name}
    </button>`;
  });
  html += `</div>`;

  html += `<div style="margin:10px 0;font-size:13px;color:var(--text2);">
    ${r.participants.length} deelnemers · pot: <strong>€${pot}</strong>
  </div>`;

  // Score invoer voor poulefase
  if (r.handmatig) {
    html += `<div style="margin:12px 0;">
      <div style="font-weight:700;font-size:14px;color:var(--navy);margin-bottom:8px;">
        📝 Scores invullen (na afloop ronde)
      </div>
      <div class="scorito-hint">
        Vul het <strong>Scorito totaalstand</strong> per deelnemer in na de laatste wedstrijd van deze ronde.
        De ronde-punten worden automatisch berekend door de vorige rondes eraf te trekken.
      </div>`;
    if (r.participants.length === 0) {
      html += '<div class="empty-state">Voeg eerst deelnemers toe.</div>';
    } else {
      html += '<table class="score-table"><thead><tr><th>Deelnemer</th><th>Scorito totaal</th><th>Ronde pts</th></tr></thead><tbody>';
      r.participants.forEach((pname, pIdx) => {
        const val = r.scores && r.scores[pname] !== undefined ? r.scores[pname] : '';
        let vorigTotaal = 0;
        for (let pi = 0; pi < currentRound; pi++) {
          const prev = state.rounds[pi];
          if (prev.handmatig && prev.scores && prev.scores[pname] !== undefined) {
            vorigTotaal = prev.scores[pname];
          }
        }
        const rondePts = val !== '' ? (parseInt(val) - vorigTotaal) : '&mdash;';
        html += '<tr>' +
          '<td>' + pname + '</td>' +
          '<td><input type="number" class="score-input" value="' + val + '" ' +
          'placeholder="bijv. 142" ' +
          'data-ridx="' + currentRound + '" data-pidx="' + pIdx + '" ' +
          'oninput="setScoreByIdx(this)"></td>' +
          '<td style="font-weight:700;color:var(--orange);text-align:center;" id="rpts-' + currentRound + '-' + pIdx + '">' + rondePts + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
    }
    
html += '</div>';
  }

  // Winnaars auto tonen
  autoSetWinners(currentRound);
  const updatedR = state.rounds[currentRound];
  if (updatedR.winner1 || updatedR.winner2) {
    html += `<div style="margin-top:12px;background:#e6f7ef;border-radius:10px;padding:12px;">
      <div style="font-weight:700;font-size:14px;color:var(--navy);margin-bottom:8px;">🏆 Winnaars (automatisch)</div>
      <div style="font-size:13px;margin-bottom:4px;">🥇 <strong>${updatedR.winner1 || '—'}</strong></div>
      <div style="font-size:13px;">🥈 <strong>${updatedR.winner2 || '—'}</strong></div>
    </div>`;
  } else {
    html += `<div style="margin-top:12px;background:#f5f5f5;border-radius:10px;padding:12px;font-size:13px;color:var(--text3);">
      🏆 Winnaars worden automatisch bepaald zodra scores zijn ingevuld.
    </div>`;
  }

  beheerEl.innerHTML = html;
}

function toggleParticipant(rIdx, pname) {
  const r = state.rounds[rIdx];
  const i = r.participants.indexOf(pname);
  if (i >= 0) r.participants.splice(i, 1);
  else r.participants.push(pname);
  queueSave(); renderAll();
}

function setScore(rIdx, pname, val) {
  const r = state.rounds[rIdx];
  if (!r.scores) r.scores = {};
  const v = parseInt(val);
  if (!isNaN(v)) r.scores[pname] = v;
  else delete r.scores[pname];
  queueSave(); renderAll();
}

function setScoreByIdx(input) {
  const rIdx = parseInt(input.dataset.ridx);
  const pIdx = parseInt(input.dataset.pidx);
  const r = state.rounds[rIdx];
  if (!r) return;
  const pname = r.participants[pIdx];
  if (!pname) return;
  if (!r.scores) r.scores = {};
  const v = parseInt(input.value);
  if (!isNaN(v) && input.value.trim() !== '') {
    r.scores[pname] = v;
  } else {
    delete r.scores[pname];
  }
  // Update ronde pts inline zonder focus te verliezen
  let vorigTotaal = 0;
  for (let pi = 0; pi < rIdx; pi++) {
    const prev = state.rounds[pi];
    if (prev.handmatig && prev.scores && prev.scores[pname] !== undefined) {
      vorigTotaal = prev.scores[pname];
    }
  }
  const rondePts = (!isNaN(v) && input.value.trim() !== '') ? (v - vorigTotaal) : '—';
  const rptsEl = document.getElementById('rpts-' + rIdx + '-' + pIdx);
  if (rptsEl) rptsEl.textContent = rondePts;
  // Update ranglijst en winnaars live
  autoSetWinners(rIdx);
  renderHuidigeRonde();
  queueSave();
}

function setScoreByIdx(input) {
  const rIdx = parseInt(input.dataset.ridx);
  const pIdx = parseInt(input.dataset.pidx);
  const r = state.rounds[rIdx];
  if (!r) return;
  const pname = r.participants[pIdx];
  if (!pname) return;
  if (!r.scores) r.scores = {};
  const v = parseInt(input.value);
  if (!isNaN(v) && input.value !== '') {
    r.scores[pname] = v;
  } else {
    delete r.scores[pname];
  }
  // Update ronde pts display inline (geen full re-render om focus niet te verliezen)
  let vorigTotaal = 0;
  for (let pi = 0; pi < rIdx; pi++) {
    const prev = state.rounds[pi];
    if (prev.handmatig && prev.scores && prev.scores[pname] !== undefined) {
      vorigTotaal = prev.scores[pname];
    }
  }
  const rondePts = (!isNaN(v) && input.value !== '') ? (v - vorigTotaal) : '—';
  const rptsEl = document.getElementById('rpts-' + rIdx + '-' + pIdx);
  if (rptsEl) rptsEl.textContent = rondePts;
  queueSave();
}

function setWinner(rIdx, pos, val) {
  if (pos === 1) state.rounds[rIdx].winner1 = val;
  else state.rounds[rIdx].winner2 = val;
  queueSave(); renderAll();
}

// ============================================================
// PRIJZEN
// ============================================================
function renderPrijzen() {
  const el1 = document.getElementById('eindprijzen-content');
  const el2 = document.getElementById('rondeprijzen-content');
  if (!el1 || !el2) return;

  const totalEind = state.players.filter(p=>p.betaald).length * 25;
  const p1 = Math.floor(totalEind * 0.60);
  const p2 = Math.floor(totalEind * 0.30);
  const p3 = totalEind - p1 - p2;

  el1.innerHTML = `
    <div class="prijs-row"><span class="prijs-label">Totale eindpot (€25 p.p.)</span><span class="prijs-bedrag">€${totalEind}</span></div>
    <div class="prijs-row"><span class="prijs-label">🥇 1e plaats (60%)</span><span class="prijs-bedrag">€${p1}</span></div>
    <div class="prijs-row"><span class="prijs-label">🥈 2e plaats (30%)</span><span class="prijs-bedrag">€${p2}</span></div>
    <div class="prijs-row"><span class="prijs-label">🥉 3e plaats (10%)</span><span class="prijs-bedrag">€${p3}</span></div>
  `;

  let html2 = '';
  state.rounds.forEach((r, i) => {
    if (r.participants.length === 0) return;
    const pot = r.participants.length * r.inleg;
    const rp1 = Math.floor(pot * 0.75);
    const rp2 = pot - rp1;
    html2 += `<div style="margin-bottom:14px;">
      <div style="font-weight:700;font-size:14px;color:var(--navy);margin-bottom:6px;">${r.name}</div>
      <div class="prijs-row"><span class="prijs-label">Rondeput (${r.participants.length}×€${r.inleg})</span><span class="prijs-bedrag">€${pot}</span></div>
      <div class="prijs-row"><span class="prijs-label">🥇 1e (75%)</span>
        <span class="prijs-bedrag">${r.winner1 ? '🏆 '+r.winner1+' · ' : ''}€${rp1}</span></div>
      <div class="prijs-row"><span class="prijs-label">🥈 2e (25%)</span>
        <span class="prijs-bedrag">${r.winner2 ? '🥈 '+r.winner2+' · ' : ''}€${rp2}</span></div>
    </div>`;
  });

  el2.innerHTML = html2 || '<div class="empty-state">Nog geen rondes met deelnemers.</div>';
}

// ============================================================
// DEELNEMERS
// ============================================================
function renderDeelnemers() {
  const el = document.getElementById('deelnemers-list');
  const totaal = document.getElementById('deeln-totaal');
  if (!el) return;

  const betaald = state.players.filter(p=>p.betaald).length;
  if (totaal) totaal.textContent = `${betaald}/${state.players.length} betaald · €${betaald*25}`;

  el.innerHTML = state.players.map((p,i) => `
    <div class="deeln-row">
      <span class="deeln-naam">${p.name}</span>
      <span class="badge ${p.betaald?'badge-betaald':'badge-open'}"
        ${isAdmin?`onclick="toggleBetaald(${i})" style="cursor:pointer"`:''}
      >${p.betaald?'✅ Betaald':'⏳ Open'}</span>
    </div>
  `).join('');
}

function toggleBetaald(i) {
  state.players[i].betaald = !state.players[i].betaald;
  queueSave(); renderDeelnemers();
}

// ============================================================
// INIT
// ============================================================
loadState();
</script>
